<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Médico - CESFAM Dalcahue</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { background-color: #161B26; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2A3441; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #00D2D3; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }
        
        /* Animación para Notificaciones Toast */
        @keyframes toast-enter { from { transform: translate(-50%, -150%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .animate-toast { animation: toast-enter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Animación para el Fondo Flotante */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-40px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 15s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        input:focus { outline: none; }
        
        /* Ocultar flechas de los input number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>

    <script>
        const defaultFirebaseConfig = {
          apiKey: "AIzaSyBCrZ014WwjBAdQXUV2h-u0-myquCuo0cE",
          authDomain: "cesfam-dalcahue-dashboard.firebaseapp.com",
          projectId: "cesfam-dalcahue-dashboard",
          storageBucket: "cesfam-dalcahue-dashboard.firebasestorage.app",
          messagingSenderId: "496853576287",
          appId: "1:496853576287:web:340bbeba5781dec34109ea",
          measurementId: "G-0XMVJ2CLPH"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const appIdGlobal = typeof __app_id !== 'undefined' ? __app_id : "cesfam-dalcahue-shared-dashboard";

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        window.firebaseAuth = firebase.auth();
        window.firebaseDb = firebase.firestore();
        window.firebaseAppId = appIdGlobal;
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useMemo, useEffect, useRef } = React;

            // Recuperamos las instancias globales seguras de Firebase
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;
            const appId = window.firebaseAppId;

            // --- Componente: Fondo Animado ---
            const AnimatedBackground = () => (
                <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-[#161B26]">
                    <div className="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-[#00D2D3] rounded-full mix-blend-screen filter blur-[150px] opacity-10 animate-blob"></div>
                    <div className="absolute top-[20%] right-[-10%] w-[40rem] h-[40rem] bg-[#BE2EDD] rounded-full mix-blend-screen filter blur-[150px] opacity-10 animate-blob animation-delay-2000"></div>
                    <div className="absolute bottom-[-20%] left-[20%] w-[40rem] h-[40rem] bg-[#0097e6] rounded-full mix-blend-screen filter blur-[150px] opacity-10 animate-blob animation-delay-4000"></div>
                </div>
            );

            // --- Iconos en formato SVG ---
            const Icon = ({ name, size = 24, className = "" }) => {
                const icons = {
                    Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                    Target: <><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></>,
                    TrendingUp: <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />,
                    TrendingDown: <polyline points="23 18 13.5 8.5 8.5 13.5 1 6" />,
                    AlertCircle: <><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></>,
                    BarChart3: <><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></>,
                    Scan: <><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><line x1="7" y1="12" x2="17" y2="12" /></>,
                    Bone: <path d="M17 10c.7-1.3 1.8-2 3-2 2.2 0 4 1.8 4 4s-1.8 4-4 4c-1.2 0-2.3-.7-3-2H7c-.7 1.3-1.8 2-3 2-2.2 0-4-1.8-4-4s1.8-4 4-4c1.2 0 2.3.7 3 2h10Z" />,
                    Glasses: <><circle cx="6" cy="15" r="4" /><circle cx="18" cy="15" r="4" /><path d="M14 15a2 2 0 0 0-4 0" /><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2" /><path d="M21.5 13 19 7c-.7-1.3-1.4-2-3-2" /></>,
                    Stethoscope: <><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" /><path d="M8 15v1a6 6 0 0 0 6 6h2" /><circle cx="20" cy="10" r="2" /></>,
                    Pill: <><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" /><path d="m8.5 8.5 7 7" /></>,
                    Sparkles: <><path d="M9.937 15.5H10L8.457 18.287l1.48.514L10 16.037l.063 2.764 1.48-.514L10 15.5Z" /><path d="M12 3v1" /><path d="M12 20v1" /><path d="M3 12h1" /><path d="M20 12h1" /><path d="m5.6 5.6.7.7" /><path d="m17.7 17.7.7.7" /><path d="m5.6 18.4.7-.7" /><path d="m17.7 6.3.7-.7" /></>,
                    BrainCircuit: <><path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 3 3 0 0 0 .34 5.58 2.5 2.5 0 0 0 2.96 3.08 2.5 2.5 0 0 0 4.96-.44" /><path d="M16 8V5c0-1.1.9-2 2-2" /><circle cx="12" cy="13" r="3" /><path d="M9 13h1" /><path d="M14 13h1" /><path d="M12 10v1" /><path d="M12 15v1" /></>,
                    RefreshCw: <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M3 21v-5h-5" /></>,
                    X: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
                    CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></>,
                    Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></>,
                    Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>,
                    Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>,
                    History: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
                    FileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></>,
                    Smartphone: <><rect x="5" y="2" width="14" height="20" rx="2" ry="2" /><line x1="12" y1="18" x2="12.01" y2="18" /></>,
                    Lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
                    Unlock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></>
                };

                return (
                    <svg 
                        xmlns="http://www.w3.org/2000/svg" 
                        width={size} 
                        height={size} 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        strokeWidth="2" 
                        strokeLinecap="round" 
                        strokeLinejoin="round" 
                        className={className}
                    >
                        {icons[name] || null}
                    </svg>
                );
            };

            const MONTHS = [
                { key: 'ene', label: 'ENE' }, { key: 'feb', label: 'FEB' }, { key: 'mar', label: 'MAR' },
                { key: 'abr', label: 'ABR' }, { key: 'may', label: 'MAY' }, { key: 'jun', label: 'JUN' },
                { key: 'jul', label: 'JUL' }, { key: 'ago', label: 'AGO' }, { key: 'sep', label: 'SEP' },
                { key: 'oct', label: 'OCT' }, { key: 'nov', label: 'NOV' }, { key: 'dic', label: 'DIC' }
            ];

            const INITIAL_DATA = [
                { id: 1, actividad: 'MAMOGRAFIA 50 A 69 AÑOS', meta: 1296, months: Array(12).fill('') },
                { id: 2, actividad: 'MAMOGRAFIA 35 AÑOS Y MAS', meta: 389, months: Array(12).fill('') },
                { id: 3, actividad: 'ECOGRAFIA MAMARIA', meta: 495, months: Array(12).fill('') },
                { id: 4, actividad: 'ECOTOMOGRAFIA ABD', meta: 495, months: [3, 3, 10, '', '', '', '', '', '', '', '', ''] },
                { id: 5, actividad: 'RADIOGRAFIA CADERA 3M', meta: 150, months: [33, 8, '', '', '', '', '', '', '', '', '', ''] },
                { id: 6, actividad: 'RADIOGRAFIA TORAX', meta: 276, months: [34, 19, '', '', '', '', '', '', '', '', '', ''] },
                { id: 7, actividad: 'LENTES UAPO', meta: 800, months: Array(12).fill('') },
                { id: 8, actividad: 'GASTROENTEROLOGIA', meta: 209, months: Array(12).fill('') },
                { id: 9, actividad: 'P.CUTANEOS', meta: 30, months: Array(12).fill('') },
                { id: 10, actividad: 'DERMATOLOGIA FARMACOS', meta: 15, months: Array(12).fill('') }
            ];

            const getIconNameForActivity = (name) => {
                const upper = name.toUpperCase();
                if (upper.includes('MAMOGRAFIA')) return 'Scan';
                if (upper.includes('ECO')) return 'Activity';
                if (upper.includes('RADIOGRAFIA')) return 'Bone';
                if (upper.includes('LENTES')) return 'Glasses';
                if (upper.includes('GASTRO')) return 'Stethoscope';
                if (upper.includes('FARMACOS') || upper.includes('DERMATOLOGIA')) return 'Pill';
                return 'Activity';
            };

            function App() {
                const currentYear = new Date().getFullYear().toString();
                const [selectedYear, setSelectedYear] = useState(currentYear);
                
                const [activities, setActivities] = useState(INITIAL_DATA);
                const [selectedService, setSelectedService] = useState('GLOBAL');
                const [user, setUser] = useState(null);
                const [isLoading, setIsLoading] = useState(true);
                
                // Estados de Sistema y UI
                const [dbStatus, setDbStatus] = useState('checking'); 
                const [dbErrorType, setDbErrorType] = useState(null);
                const [syncStatus, setSyncStatus] = useState('synced'); 
                const [rulesCopied, setRulesCopied] = useState(false);
                
                // Modal, QR y Logs
                const [showLogs, setShowLogs] = useState(false);
                const [logs, setLogs] = useState([]);
                const [showQR, setShowQR] = useState(true);
                
                // Nuevas Funcionalidades: Notificaciones y Bloqueo
                const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
                const [lockedMonths, setLockedMonths] = useState(Array(12).fill(false));
                const [lockedMeta, setLockedMeta] = useState(false);
                
                const [hasChanges, setHasChanges] = useState(false);
                const hasChangesRef = useRef(false);

                useEffect(() => {
                    hasChangesRef.current = hasChanges;
                }, [hasChanges]);

                // Mostrar Toast
                const showToastNotification = (message, type = 'success') => {
                    setToast({ show: true, message, type });
                    setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
                };

                // Estructura segura de reglas en texto plano para blindarlo contra Babel
                const cleanRulesText = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";

                // Función de copiado limpio
                const handleCopyRules = () => {
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            navigator.clipboard.writeText(cleanRulesText).then(() => {
                                setRulesCopied(true);
                                setTimeout(() => setRulesCopied(false), 3000);
                            });
                        } else {
                            const textArea = document.createElement("textarea");
                            textArea.value = cleanRulesText;
                            textArea.style.position = "fixed";
                            textArea.style.left = "-999999px";
                            document.body.appendChild(textArea);
                            textArea.focus();
                            textArea.select();
                            document.execCommand("copy");
                            textArea.remove();
                            setRulesCopied(true);
                            setTimeout(() => setRulesCopied(false), 3000);
                        }
                    } catch (e) {
                        console.error("Error al copiar: ", e);
                    }
                };

                // Iniciar Autenticación Segura
                useEffect(() => {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }
                        } catch (e) { 
                            setDbStatus('error');
                            setDbErrorType('auth');
                            setIsLoading(false);
                        }
                    };
                    initAuth();
                    const unsubscribe = auth.onAuthStateChanged((u) => {
                        setUser(u);
                        if (!u) setIsLoading(false); 
                    });
                    return () => unsubscribe();
                }, []);

                // Conectar a Firestore (Actividades y Configuración)
                useEffect(() => {
                    if (!user) return;
                    setIsLoading(true);
                    
                    const collectionName = `activities_${selectedYear}`;
                    const actsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collectionName);
                    const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc(`settings_${selectedYear}`);
                    
                    // Escuchar Configuración (Meses Bloqueados)
                    const unsubConfig = configRef.onSnapshot(doc => {
                        if (doc.exists) {
                            if (!hasChangesRef.current) {
                                setLockedMonths(doc.data().lockedMonths || Array(12).fill(false));
                                setLockedMeta(doc.data().lockedMeta || false);
                            }
                        } else {
                            setLockedMonths(Array(12).fill(false));
                            setLockedMeta(false);
                        }
                    });

                    // Escuchar Actividades
                    const unsubscribe = actsRef.onSnapshot((snapshot) => {
                        if (snapshot.empty) {
                            setSyncStatus('syncing');
                            const batch = db.batch();
                            INITIAL_DATA.forEach(act => {
                                const docRef = actsRef.doc(act.id.toString());
                                batch.set(docRef, act);
                            });
                            batch.commit().catch(e => console.error("Init err:", e));
                        } else {
                            const data = snapshot.docs.map(d => d.data()).sort((a, b) => a.id - b.id);
                            
                            if (!hasChangesRef.current) {
                                setActivities(data);
                                setSyncStatus('synced');
                            }
                            
                            setDbStatus('connected');
                            setDbErrorType(null);
                        }
                        setIsLoading(false);
                    }, (err) => {
                        setDbStatus('error');
                        if (err.message.includes("Cloud Firestore API has not been used") || err.message.includes("is disabled")) {
                            setDbErrorType('not-created');
                        } else if (err.message.includes("permission-denied") || err.message.includes("Missing or insufficient permissions")) {
                            setDbErrorType('permissions');
                        } else {
                            setDbErrorType('unknown');
                        }
                        setIsLoading(false);
                    });
                    return () => { unsubscribe(); unsubConfig(); };
                }, [user, selectedYear]);

                // Historial de Logs
                useEffect(() => {
                    if (!user || !showLogs) return;
                    const logsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${selectedYear}`).orderBy('timestamp', 'desc').limit(20);
                    const unsub = logsRef.onSnapshot(snap => {
                        setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    return () => unsub();
                }, [user, showLogs, selectedYear]);

                // Procesamiento de datos y KPIs
                const processedData = useMemo(() => {
                    const actualYear = new Date().getFullYear();
                    const evalYear = parseInt(selectedYear);
                    let passedMonths = 12;
                    
                    if (evalYear === actualYear) {
                        passedMonths = Math.max(1, new Date().getMonth() + 1);
                    } else if (evalYear > actualYear) {
                        passedMonths = 1;
                    }

                    return activities.map(act => {
                        const total = act.months.reduce((sum, val) => sum + (Number(val) || 0), 0);
                        const avance = act.meta > 0 ? ((total / act.meta) * 100).toFixed(2) : "0.00";
                        const pendiente = act.meta > 0 ? Math.max(0, act.meta - total) : 0;
                        
                        const runRate = (total / passedMonths) * 12;
                        const projected = Math.round(runRate);
                        const expectedMetaNow = (act.meta / 12) * passedMonths;
                        
                        let forecastAlert = 'neutral';
                        if (act.meta > 0) {
                            if (total >= expectedMetaNow * 0.95) forecastAlert = 'good';
                            else if (total < expectedMetaNow * 0.75) forecastAlert = 'bad';
                            else forecastAlert = 'warning';
                        }

                        return { ...act, total, avance, pendiente, projected, forecastAlert };
                    });
                }, [activities, selectedYear]);

                const kpis = useMemo(() => {
                    const data = selectedService === 'GLOBAL' 
                        ? processedData 
                        : processedData.filter(a => a.id.toString() === selectedService);
                    const meta = data.reduce((s, a) => s + a.meta, 0);
                    const realizado = data.reduce((s, a) => s + a.total, 0);
                    const avance = meta > 0 ? ((realizado / meta) * 100).toFixed(2) : "0.00";
                    return { meta, realizado, avance };
                }, [processedData, selectedService]);

                const monthlyTotals = useMemo(() => {
                    const totals = Array(12).fill(0);
                    const data = selectedService === 'GLOBAL' 
                        ? processedData 
                        : processedData.filter(a => a.id.toString() === selectedService);
                    data.forEach(act => {
                        act.months.forEach((v, i) => { totals[i] += Number(v) || 0; });
                    });
                    return totals;
                }, [processedData, selectedService]);

                const { chartTicks, chartMax } = useMemo(() => {
                    const max = Math.max(...monthlyTotals, 0);
                    const niceMax = max === 0 ? 10 : Math.ceil(max / 10) * 10;
                    const ticks = [];
                    for (let i = 5; i >= 0; i--) ticks.push(Math.round((niceMax / 5) * i));
                    return { chartTicks: ticks, chartMax: niceMax };
                }, [monthlyTotals]);

                // Funciones de Edición LOCAL (Meses y Metas)
                const handleMonthEdit = (id, mIdx, val) => {
                    if (val !== '' && !/^\d+$/.test(val)) return;
                    if (lockedMonths[mIdx]) return; 

                    const updatedActivities = activities.map(act => {
                        if (act.id === id) {
                            const newMonths = [...act.months];
                            newMonths[mIdx] = val;
                            return { ...act, months: newMonths };
                        }
                        return act;
                    });
                    
                    setActivities(updatedActivities);
                    setHasChanges(true);
                    setSyncStatus('unsaved');
                };

                const handleMetaEdit = (id, val) => {
                    if (val !== '' && !/^\d+$/.test(val)) return;
                    if (lockedMeta) return;

                    const updatedActivities = activities.map(act => {
                        if (act.id === id) {
                            return { ...act, meta: val === '' ? 0 : Number(val) };
                        }
                        return act;
                    });
                    
                    setActivities(updatedActivities);
                    setHasChanges(true);
                    setSyncStatus('unsaved');
                };

                const toggleMonthLock = (mIdx) => {
                    const newLocked = [...lockedMonths];
                    newLocked[mIdx] = !newLocked[mIdx];
                    setLockedMonths(newLocked);
                    setHasChanges(true);
                    setSyncStatus('unsaved');
                };

                const toggleMetaLock = () => {
                    setLockedMeta(!lockedMeta);
                    setHasChanges(true);
                    setSyncStatus('unsaved');
                };

                // Función de GUARDADO EN LA NUBE
                const handleSave = async () => {
                    if (!user || dbStatus === 'error') {
                        setSyncStatus('error');
                        showToastNotification('Error: Sin conexión', 'error');
                        return; 
                    }
                    
                    setSyncStatus('syncing');
                    try {
                        const batch = db.batch();
                        
                        // Guardar Actividades
                        const activitiesRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`activities_${selectedYear}`);
                        activities.forEach(act => {
                            const docRef = activitiesRef.doc(act.id.toString());
                            batch.set(docRef, act);
                        });
                        
                        // Guardar Configuración (Meses Bloqueados)
                        const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc(`settings_${selectedYear}`);
                        batch.set(configRef, { lockedMonths, lockedMeta }, { merge: true });

                        // Guardar Historial de Auditoría
                        const logRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${selectedYear}`).doc();
                        batch.set(logRef, {
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),

                                                        <td className={`p-0 border-r border-[#2A3441] relative transition-colors ${lockedMeta ? 'bg-red-900/10 opacity-70 cursor-not-allowed' : 'group-hover/row:bg-[#161B26]/30'}`}>
                                                            <div className="absolute inset-y-0 right-2 flex items-center pointer-events-none opacity-20">
                                                                <Icon name="Target" size={12} className="text-[#BE2EDD]" />
                                                            </div>
                                                            <input 
                                                                type="text" 
                                                                inputMode="numeric"
                                                                value={row.meta} 
                                                                onChange={(e) => handleMetaEdit(row.id, e.target.value)} 
                                                                className={`w-full h-11 bg-transparent text-right pr-6 focus:bg-[#161B26] outline-none text-[#BE2EDD] font-bold font-mono transition-colors ${lockedMeta ? 'cursor-not-allowed' : ''}`} 
                                                                disabled={lockedMeta || (dbStatus === 'error' && !hasChanges)}
                                                                title={lockedMeta ? "Meta bloqueada" : ""}
                                                            />
                                                        </td>
                                                        
                                                        <td className="px-3 py-3 text-right border-r border-[#2A3441] font-bold font-mono" style={{ color: Number(row.avance) >= 100 ? '#E056FD' : '#00D2D3' }}>{row.avance}%</td>
                                                        {row.months.map((val, i) => (
                                                            <td key={i} className={`p-0 border-r border-[#2A3441] transition-colors ${lockedMonths[i] ? 'bg-red-900/10 opacity-70 cursor-not-allowed' : ''}`}>
                                                                <input 
                                                                    type="text" 
                                                                    inputMode="numeric"
                                                                    value={val} 
                                                                    onChange={(e) => handleMonthEdit(row.id, i, e.target.value)} 
                                                                    placeholder="-" 
                                                                    className={`w-full h-10 bg-transparent text-center focus:bg-[#161B26] outline-none text-white placeholder-[#2A3441] transition-colors ${lockedMonths[i] ? 'cursor-not-allowed' : ''}`} 
                                                                    disabled={lockedMonths[i] || (dbStatus === 'error' && !hasChanges)} 
                                                                    title={lockedMonths[i] ? "Mes bloqueado" : ""}
                                                                />
                                                            </td>
                                                        ))}
                                                        <td className="px-3 py-3 text-right border-r border-[#2A3441] font-bold bg-[#161B26]/30 font-mono text-white">{row.total}</td>
                                                        <td className="px-3 py-3 text-right font-bold text-[#A5B1C2] bg-[#161B26]/30 font-mono">{row.pendiente}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Firma Original */}
                                <div className="flex items-center gap-4 mt-12 pb-8 border-t border-[#2A3441]/50 pt-6">
                                    <div className="w-16 h-16 rounded-full border-2 border-[#00D2D3] shadow-lg flex items-center justify-center bg-[#1A202E] overflow-hidden relative shrink-0">
                                        <img 
                                            src="Logo con el sononauta .jpg" 
                                            alt="Logo" 
                                            className="w-full h-full object-cover z-10" 
                                            onError={(e) => { e.target.style.display = 'none'; }} 
                                        />
                                        <Icon name="Activity" className="text-[#00D2D3] absolute opacity-50 z-0" />
                                    </div>
                                    <div className="text-[11px] text-[#A5B1C2] leading-relaxed font-medium">
                                        <p className="text-[#00D2D3] font-bold text-[14px]">Camilo Torres Arismendi.</p>
                                        <p>Tecnólogo Médico. | Encargado de Imagenología. | Cesfam Dalcahue.</p>
                                    </div>
                                </div>
                            </div>

                            {/* Widget de QR */}
                            {showQR && (
                                <div className="absolute bottom-6 right-6 bg-[#1A202E] border border-[#2A3441] p-3 rounded-2xl shadow-lg flex flex-col items-center gap-2 z-10 group hover:border-[#00D2D3]/50 transition-all">
                                    <button 
                                        onClick={() => setShowQR(false)} 
                                        className="absolute -top-3 -right-3 bg-[#161B26] border border-[#2A3441] rounded-full p-1 text-[#A5B1C2] hover:text-white hover:bg-red-500 hover:border-red-500 transition-all z-10 shadow-md"
                                        title="Ocultar QR"
                                    >
                                        <Icon name="X" size={14} />
                                    </button>
                                    <div className="bg-white p-2 rounded-xl shadow-inner min-w-[80px] min-h-[80px] flex items-center justify-center">
                                        <img 
                                            src={`https://quickchart.io/qr?text=${encodeURIComponent('https://camibyte.github.io/App-Control-de-programas-ID-y-Resolutividad/')}&dark=161B26&size=100&margin=1`} 
                                            alt="Código QR para Móvil" 
                                            className="w-[80px] h-[80px] object-contain" 
                                            onError={(e) => { e.target.style.display = 'none'; }}
                                        />
                                    </div>
                                    <div className="flex items-center gap-1.5 text-[#00D2D3]">
                                        <Icon name="Smartphone" size={14} />
                                        <p className="text-[9px] font-bold uppercase tracking-widest text-center mt-0.5">Móvil</p>
                                    </div>
                                </div>
                            )}

                        </div>
                    </>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
</body>
</html>
